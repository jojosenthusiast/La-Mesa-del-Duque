<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión — La Mesa del Duque</title>
    <link rel="stylesheet" href="~/css/marca.css" asp-append-version="true" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1b2d;
            color: #f7f4ec;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }
        .offline-container {
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .offline-title {
            font-family: 'Cinzel', serif;
            font-size: 1.75rem;
            color: #c9a76b;
            margin-bottom: 0.75rem;
        }
        .offline-msg {
            font-size: 1rem;
            color: #aaa;
            max-width: 400px;
            margin: 0 auto 1.5rem;
            line-height: 1.5;
        }
        .offline-retry {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 0.5rem;
            background: #c9a76b;
            color: #0f1b2d;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .offline-retry:hover {
            background: #d4b56a;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1 class="offline-title">Sin conexión</h1>
        <p class="offline-msg">
            La Mesa del Duque está funcionando en modo offline.<br>
            Los pedidos se guardan localmente y se sincronizarán cuando la conexión se restaure.
        </p>
        <button class="offline-retry" onclick="window.location.reload()">Reintentar conexión</button>
    </div>
</body>
</html>
